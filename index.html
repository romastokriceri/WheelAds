<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6f8">
  <meta name="description" content="Шины и диски в наличии. Быстрый поиск по сезону и размеру.">
  <title>Шины и диски в наличии</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#18212c;background:#f4f6f8;font-synthesis:none;text-rendering:optimizeLegibility}
    *{box-sizing:border-box}body{margin:0}.wrap{width:min(1120px,100% - 32px);margin:auto;padding:34px 0 64px}
    header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:24px}h1{font-size:clamp(27px,5vw,42px);letter-spacing:-.04em;margin:0 0 6px}.sub{color:#647181;margin:0}
    .updated{font-size:12px;color:#84909e;white-space:nowrap}.toolbar{position:sticky;top:0;z-index:2;background:#f4f6f8;padding:10px 0 14px}
    .filter-label{display:block;color:#657181;font-size:12px;font-weight:700;margin:2px 2px 6px}.filters{display:flex;gap:8px;overflow:auto;padding:2px 1px 10px;scrollbar-width:thin}.filter{min-height:42px;border:1px solid #d9e0e7;border-radius:999px;padding:9px 16px;background:white;color:#374454;font:inherit;font-size:14px;font-weight:650;white-space:nowrap;cursor:pointer;touch-action:manipulation}.filter:focus-visible,.search:focus-visible{outline:3px solid #4386d2;outline-offset:2px}
    .filter[aria-pressed="true"]{background:#172b42;border-color:#172b42;color:white}.search{width:100%;border:1px solid #d9e0e7;border-radius:12px;padding:14px 15px;font-size:16px;outline:none;background:white}.search:focus{border-color:#4386d2;box-shadow:0 0 0 3px #4386d222}
    .summary{display:flex;justify-content:space-between;color:#657181;font-size:14px;margin:12px 2px 16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:14px}.card{background:white;border:1px solid #e1e6eb;border-radius:16px;padding:18px;box-shadow:0 4px 16px #1c2b3a08;min-width:0;content-visibility:auto;contain-intrinsic-size:auto 230px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.tag{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:750;color:#526273;background:#edf1f5;border-radius:999px;padding:6px 9px}.tag.winter{color:#145998;background:#e7f2ff}.tag.summer{color:#946000;background:#fff2d4}.id{color:#8a95a1;font-size:12px}.title{font-size:18px;line-height:1.3;margin:14px 0 6px}.size{font-size:15px;color:#475567;min-height:22px}.details{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px}.detail{background:#f3f5f7;color:#596677;border-radius:7px;padding:5px 8px;font-size:12px}.bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px}.price{font-size:19px;font-weight:750}.open{color:#145998;font-weight:700;text-decoration:none}.empty,.loading,.error{grid-column:1/-1;background:white;border-radius:14px;padding:28px;text-align:center;color:#657181}#load-sentinel{grid-column:1/-1;height:1px}.skeleton{height:177px;border-radius:16px;background:linear-gradient(100deg,#e8edf1 25%,#f4f6f8 40%,#e8edf1 60%);background-size:200% 100%;animation:shine 1.2s infinite}@keyframes shine{to{background-position-x:-200%}}
    @media(max-width:600px){.wrap{width:calc(100% - 22px);padding-top:24px}header{align-items:flex-start;flex-direction:column;gap:6px}.updated{white-space:normal}.grid{grid-template-columns:1fr 1fr;gap:9px}.card{padding:13px;border-radius:13px}.title{font-size:16px}.size{font-size:13px}.price{font-size:17px}.open{font-size:13px}.detail{font-size:11px;padding:5px 6px}}
    @media(max-width:380px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div><h1>Шины и диски</h1><p class="sub">Актуальные товары в наличии</p></div>
      <div class="updated" id="updated"></div>
    </header>
    <section class="toolbar" aria-label="Поиск и фильтры">
      <nav class="filters" aria-label="Сезон">
        <button class="filter" data-season="all" aria-pressed="true">Все товары</button>
        <button class="filter" data-season="winter" aria-pressed="false">❄️ Зима</button>
        <button class="filter" data-season="summer" aria-pressed="false">☀️ Лето</button>
      </nav>
      <span class="filter-label" id="radius-label">Диаметр колеса</span>
      <nav class="filters" aria-labelledby="radius-label" id="radius-filters">
        <button class="filter" data-radius="all" aria-pressed="true">Любой</button>
        <button class="filter" data-radius="13" aria-pressed="false">R13</button>
        <button class="filter" data-radius="14" aria-pressed="false">R14</button>
        <button class="filter" data-radius="15" aria-pressed="false">R15</button>
        <button class="filter" data-radius="16" aria-pressed="false">R16</button>
        <button class="filter" data-radius="17" aria-pressed="false">R17</button>
        <button class="filter" data-radius="18" aria-pressed="false">R18</button>
        <button class="filter" data-radius="19" aria-pressed="false">R19</button>
        <button class="filter" data-radius="20" aria-pressed="false">R20</button>
        <button class="filter" data-radius="21" aria-pressed="false">R21</button>
        <button class="filter" data-radius="22" aria-pressed="false">R22</button>
        <button class="filter" data-radius="23" aria-pressed="false">R23</button>
        <button class="filter" data-radius="24" aria-pressed="false">R24</button>
      </nav>
      <label class="filter-label" for="search">Или найдите по размеру, марке, модели или ID</label>
      <input class="search" id="search" type="search" placeholder="Например: 205/55 R16 или 0123" autocomplete="off" enterkeyhint="search">
    </section>
    <div class="summary" role="status" aria-live="polite"><span id="count">Загрузка товаров…</span><span id="refresh"></span></div>
    <section class="grid" id="items" aria-busy="true">
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    </section>
  </main>
  <script src="/catalog.js" defer></script>
</body>
</html>
